name: fitness_flutter
description: Flutter fitness app UI connected to wger API with device sync.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  fl_chart: ^1.2.0
  flutter_svg: ^2.3.0
  dio: ^5.11.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5

  # Device sync packages
  health: ^13.3.2
  flutter_blue_plus: ^2.3.12
  permission_handler: ^11.3.1
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/