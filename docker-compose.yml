version: '3.8'

services:
  # Flutter Web App (served by Coolify, Traefik labels HERE)
  flutter-web:
    image: ghcr.io/flixnettv/fitness-flutter-web:latest
    container_name: fitness-flutter-web
    restart: unless-stopped
    networks:
      - coolify
      - wger-internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.flutter.entrypoints=http
      - traefik.http.routers.flutter.rule=Host(`Fitness.hftv.qzz.io`)
      - traefik.http.routers.flutter.middlewares=redirect-to-https, flutter-compress
      - traefik.http.routers.flutter-https.entrypoints=https
      - traefik.http.routers.flutter-https.rule=Host(`Fitness.hftv.qzz.io`)
      - traefik.http.routers.flutter-https.middlewares=flutter-compress
      - traefik.http.routers.flutter-https.tls=true
      - traefik.http.routers.flutter-https.tls.certresolver=letsencrypt
      - traefik.http.services.flutter.loadbalancer.server.port=80
      - traefik.http.middlewares.flutter-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.flutter-compress.compress=true

  # wger API (internal only, no Traefik labels)
  web:
    image: 'docker.io/wger/server:latest'
    container_name: wger-web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - 'SITE_URL=https://Fitness.hftv.qzz.io'
      - TIME_ZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
      - 'WGER_INSTANCE=https://wger.de'
      - ALLOW_REGISTRATION=True
      - ALLOW_GUEST_USERS=False
      - ALLOW_UPLOAD_VIDEOS=True
      - MIN_ACCOUNT_AGE_TO_TRUST=21
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - DJANGO_DEBUG=False
      - WGER_USE_GUNICORN=True
      - WGER_PORT=8000
      - USE_CELERY=True
      - 'CELERY_BROKER=redis://cache:6379/2'
      - 'CELERY_BACKEND=redis://cache:6379/2'
      - CELERY_WORKER_CONCURRENCY=4
      - CELERY_FLOWER_PASSWORD=adminadmin
      - SYNC_EXERCISES_CELERY=True
      - SYNC_EXERCISE_IMAGES_CELERY=True
      - SYNC_EXERCISE_VIDEOS_CELERY=True
      - SYNC_INGREDIENTS_CELERY=True
      - 'SYNC_INGREDIENTS_DUMP_URL=https://wger.de/media/ingredients/ingredients.jsonl.gz'
      - DOWNLOAD_INGREDIENTS_FROM=WGER
      - CACHE_API_EXERCISES_CELERY=True
      - CACHE_API_EXERCISES_CELERY_FORCE_UPDATE=True
      - POSTGRES_USER=wger
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=wger
      - 'PS_DATABASE_URI=postgres://wger:${POSTGRES_PASSWORD}@db:5432/wger'
      - 'PS_STORAGE_PG_URI=postgres://wger:${POSTGRES_PASSWORD}@db:5432/wger'
      - PS_PORT=8080
      - POWERSYNC_URL_PATH=ps
      - DJANGO_PERFORM_MIGRATIONS=True
      - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
      - 'DJANGO_CACHE_LOCATION=redis://cache:6379/1'
      - DJANGO_CACHE_TIMEOUT=1296000
      - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
      - DJANGO_CLEAR_STATIC_FIRST=False
      - DJANGO_COLLECTSTATIC_ON_STARTUP=True
      - EXERCISE_CACHE_TTL=2419200
      - ACCESS_TOKEN_LIFETIME=10
      - REFRESH_TOKEN_LIFETIME=2880
      - AXES_ENABLED=True
      - AXES_FAILURE_LIMIT=10
      - AXES_COOLOFF_TIME=30
      - AXES_HANDLER=axes.handlers.cache.AxesCacheHandler
      - AXES_LOCKOUT_PARAMETERS=ip_address
      - 'AXES_IPWARE_META_PRECEDENCE_ORDER=HTTP_X_FORWARDED_FOR,REMOTE_ADDR'
      - NUMBER_OF_PROXIES=1
      - 'GUNICORN_CMD_ARGS=--workers 3 --threads 2 --worker-class gthread --timeout 240'
      - LOG_LEVEL_PYTHON=INFO
      - USE_RECAPTCHA=False
      - EXPOSE_PROMETHEUS_METRICS=False
      - 'FROM_EMAIL=wger Workout Manager <wger@Fitness.hftv.qzz.io>'
      - 'CSRF_TRUSTED_ORIGINS=https://Fitness.hftv.qzz.io'
      - X_FORWARDED_PROTO_HEADER_SET=True
      - USE_X_FORWARDED_HOST=True
    volumes:
      - 'wger-static:/home/wger/static'
      - 'wger-media:/home/wger/media'
    expose:
      - 8000
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://localhost:8000'
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 5
    restart: unless-stopped
    networks:
      - wger-internal

  nginx:
    image: 'docker.io/nginx:stable'
    container_name: wger-nginx
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      - web
    volumes:
      - './nginx.api.conf:/etc/nginx/conf.d/default.conf:ro'
      - 'wger-static:/wger/static:ro'
      - 'wger-media:/wger/media:ro'
    expose:
      - 80
    healthcheck:
      test:
        - CMD
        - service
        - nginx
        - status
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wger-internal

  celery_worker:
    image: 'docker.io/wger/server:latest'
    container_name: wger-celery-worker
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command: /start-worker
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - 'SITE_URL=https://Fitness.hftv.qzz.io'
      - TIME_ZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
      - 'WGER_INSTANCE=https://wger.de'
      - ALLOW_REGISTRATION=True
      - DJANGO_DEBUG=False
      - WGER_USE_GUNICORN=True
      - USE_CELERY=True
      - 'CELERY_BROKER=redis://cache:6379/2'
      - 'CELERY_BACKEND=redis://cache:6379/2'
      - CELERY_WORKER_CONCURRENCY=4
      - POSTGRES_USER=wger
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=wger
      - 'PS_DATABASE_URI=postgres://wger:${POSTGRES_PASSWORD}@db:5432/wger'
      - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
      - 'DJANGO_CACHE_LOCATION=redis://cache:6379/1'
      - DJANGO_CACHE_TIMEOUT=1296000
      - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
      - LOG_LEVEL_PYTHON=INFO
    volumes:
      - 'wger-media:/home/wger/media'
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - celery
        - '-A'
        - wger
        - inspect
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wger-internal

  celery_beat:
    image: 'docker.io/wger/server:latest'
    container_name: wger-celery-beat
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command: /start-beat
    volumes:
      - 'wger-celery-beat:/home/wger/beat/'
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - 'SITE_URL=https://Fitness.hftv.qzz.io'
      - TIME_ZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
      - 'WGER_INSTANCE=https://wger.de'
      - ALLOW_REGISTRATION=True
      - DJANGO_DEBUG=False
      - USE_CELERY=True
      - 'CELERY_BROKER=redis://cache:6379/2'
      - 'CELERY_BACKEND=redis://cache:6379/2'
      - POSTGRES_USER=wger
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=wger
      - 'PS_DATABASE_URI=postgres://wger:${POSTGRES_PASSWORD}@db:5432/wger'
      - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
      - 'DJANGO_CACHE_LOCATION=redis://cache:6379/1'
      - DJANGO_CACHE_TIMEOUT=1296000
      - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
      - LOG_LEVEL_PYTHON=INFO
    depends_on:
      celery_worker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wger-internal

  db:
    image: 'docker.io/postgres:15-alpine'
    container_name: wger-db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    environment:
      - POSTGRES_USER=wger
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=wger
      - TZ=Asia/Riyadh
    volumes:
      - 'wger-postgres-data:/var/lib/postgresql/data/'
    command:
      - postgres
      - '-c'
      - wal_level=logical
      - '-c'
      - shared_buffers=256MB
      - '-c'
      - effective_cache_size=768MB
      - '-c'
      - work_mem=8MB
      - '-c'
      - random_page_cost=1.1
      - '-c'
      - max_connections=30
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U wger'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wger-internal

  cache:
    image: 'docker.io/redis:7-alpine'
    container_name: wger-cache
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command:
      - redis-server
      - '--maxmemory'
      - 512mb
      - '--maxmemory-policy'
      - volatile-lru
      - '--save'
      - '3600'
      - '1'
      - '300'
      - '100'
      - '60'
      - '10000'
      - '--appendonly'
      - 'yes'
    volumes:
      - 'wger-redis-data:/data'
    healthcheck:
      test: 'redis-cli ping'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wger-internal

volumes:
  wger-postgres-data: null
  wger-redis-data: null
  wger-static: null
  wger-media: null
  wger-celery-beat: null

networks:
  coolify:
    external: true
  wger-internal:
    internal: true